# Sobe o Controle Normativo com PostgreSQL. Uso: docker compose up -d --build
# Em produção, prefira um PostgreSQL gerenciado pelo time de banco (ajuste DATABASE_URL e remova o serviço "db").
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: controle_normativo
      POSTGRES_USER: controle_normativo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controle_normativo"]
      interval: 10s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://controle_normativo:${POSTGRES_PASSWORD}@db:5432/controle_normativo
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
